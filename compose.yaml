services:
  postgres:
    image: docker.io/postgres:18.6-alpine3.24
    container_name: yak-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${POSTGRES_DATASET}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  yak-server:
    image: ghcr.io/yak-toto/yak-server:0.94.11-world_cup_2026@sha256:9243a11bb2334f33a9f39a8dda271a42b5e8d712718094a41b918c1d39a3438f
    container_name: yak-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  yak-display:
    image: ghcr.io/yak-toto/yak-display:0.21.4@sha256:2831f89100b61aaa1083292ce1f117968ae53801f30724d71a393a3fd5abf29e
    container_name: yak-display
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 3000:80
    depends_on:
      yak-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
