services:
  postgres:
    image: docker.io/postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    container_name: yak-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${POSTGRES_DATASET}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  yak-server:
    image: ghcr.io/yak-toto/yak-server:0.94.25-world_cup_2026@sha256:c766177d9b1abc6a24e9173b5bb5ec8e1ae7a30e70f2a42f59e373cda8ba1a14
    container_name: yak-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  yak-display:
    image: ghcr.io/yak-toto/yak-display:0.23.5@sha256:b7d9109289e50b6e77f06a66fd4f74971676341f1c83aab7aa3cdf16e6f6dd8b
    container_name: yak-display
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 3000:80
    depends_on:
      yak-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
